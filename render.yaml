# Render Blueprint: runs the Sunbridger (Sungrow) agent in the cloud, so its link works
# when your PC is off. In the cloud there's no GPU for the local model, so it uses Claude.
# Deploy: https://render.com/deploy?repo=https://github.com/kowshickj-git/Voice-agent
# Render asks for the two keys marked "sync: false" and generates WEB_ACCESS_KEY.
services:
  - type: web
    name: sunbridger-voice-agent
    runtime: node
    plan: free # sleeps after 15 idle minutes (the next visit takes about a minute); "starter" stays awake
    region: oregon # next to Deepgram and the Claude API, which every turn calls
    buildCommand: npm ci --include=dev
    startCommand: npx tsx src/index.ts --agent=sungrow
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "8081" # agents/sungrow/agent.env sets the same port
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: LLM_EFFORT
        value: low
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WEB_ACCESS_KEY
        generateValue: true
      # Optional: saved messages are lost when the free server restarts, so forward them
      # to Slack, email (via Zapier or Make), or any URL that accepts a JSON POST.
      - key: MESSAGE_WEBHOOK_URL
        sync: false
